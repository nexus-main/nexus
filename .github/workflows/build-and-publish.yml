name: Build and Publish

on:
  push:
    branches:
      - master
      - dev

    tags:
      - "*"

  pull_request:
    branches:
      - dev

# Least privilege by default; jobs widen this only where needed.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Metadata
        run: echo "IS_RELEASE=${{ startsWith(github.ref, 'refs/tags/') }}" >> $GITHUB_ENV

      - name: Environment
        run: |
          echo "VERSION=$(python build/print_version.py ${{ github.run_number }} ${{ env.IS_RELEASE }} false)" >> $GITHUB_ENV
          echo "PYPI_VERSION=$(python build/print_version.py ${{ github.run_number }} ${{ env.IS_RELEASE }} pypi)" >> $GITHUB_ENV
          echo "$(python build/print_solution.py)" >> $GITHUB_ENV

      - name: Extract annotation tag
        if: ${{ env.IS_RELEASE == 'true' }}
        run: python build/create_tag_body.py

      - name: Set up dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Explicit cache instead of the `cache:` inputs of the setup actions, because
      # those require lock files (and the TS steps use --no-package-lock).
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.npm
            ~/.cache/pip
          key: deps-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/package.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install
        run: |
          npm install -g pyright@1.1.369
          python -m pip install frictionless==4.40.9 build wheel httpx pyarrow pytest pytest-asyncio

      # --- Fast checks first (fail early, before the expensive steps) ---

      - name: Type-check TypeScript client
        working-directory: src/clients/typescript
        run: |
          npm install --no-package-lock
          npm run typecheck

      - name: Fast checks (JS tests, pyright)
        run: |
          node --test tests/js/*.test.js
          pyright

      # --- Build ---

      - name: Build
        run: |
          dotnet publish -c Release -o app /p:GeneratePackage=true src/Nexus/Nexus.csproj
          dotnet build -c Release src/clients/dotnet/client.csproj
          python -m build --wheel --outdir artifacts/package --no-isolation src/clients/python
          python -m build --wheel --outdir artifacts/package --no-isolation src/extensibility/python-extensibility
          (cd src/clients/typescript && npm pkg set version="${VERSION}" && npm pack --pack-destination ../../../artifacts/package)
          git checkout -- src/clients/typescript/package.json

      # --- Tests ---

      - name: Test
        run: |
          dotnet test -c Release /p:BuildProjectReferences=false
          pytest

      - name: Test TypeScript client
        working-directory: tests/clients/typescript-tests
        run: |
          npm install --no-package-lock
          npm run typecheck
          npm test

      - name: API
        run: |
          dotnet run --project src/Nexus.ClientGenerator/Nexus.ClientGenerator.csproj -- ./ openapi_new.json
          diff --strip-trailing-cr openapi.json openapi_new.json
          diff --strip-trailing-cr openapi.v2.json openapi_new.v2.json
          # Fail if generated clients changed, which means committed client sources are stale.
          test -z "$(git status --porcelain -- src/clients/dotnet src/clients/python/nexus_api src/clients/typescript)"

      # --- Docker last: it is the slowest step and only matters if everything above passed ---

      - name: Docker Build
        run: |
          mkdir --parent artifacts/images
          docker build -t nexus-main/nexus:v_next .
          docker save --output artifacts/images/nexus_image.tar nexus-main/nexus:v_next

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            artifacts/*.txt
            artifacts/package/
            artifacts/images/

      - name: Upload GitHub Pages content
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-content
          path: app/wwwroot

    outputs:
      is_release: ${{ env.IS_RELEASE }}
      version: ${{ env.VERSION }}

  deploy_pages:
    needs: build
    name: Deploy (GitHub Pages)
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    permissions:
      contents: write # push to gh-pages; only this job gets a write-capable token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Pages content
        uses: actions/download-artifact@v4
        with:
          name: github-pages-content
          path: wwwroot

      # Created here because upload-artifact skips hidden files by default
      - name: Prepare GitHub Pages
        run: touch wwwroot/.nojekyll

      - name: Deploy GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: wwwroot

  publish_dev:
    needs: build
    name: Publish (dev)
    runs-on: ubuntu-latest

    # Never publish from pull requests (fork PRs have no secrets; same-repo PRs would publish dev builds)
    if: ${{ needs.build.outputs.is_release != 'true' && github.event_name != 'pull_request' }}

    permissions:
      contents: read
      packages: write # push to ghcr.io

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Docker Load Image
        run: docker load --input artifacts/images/nexus_image.tar

      - name: Nuget package (MyGet)
        run: dotnet nuget push 'artifacts/package/release/*.nupkg' --api-key ${MYGET_API_KEY} --source https://www.myget.org/F/apollo3zehn-dev/api/v3/index.json
        env:
          MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}

      - name: Python package (MyGet)
        run: 'for filePath in artifacts/package/*.whl; do curl -k -X POST https://www.myget.org/F/apollo3zehn-dev/python/upload -H "Authorization: Bearer ${MYGET_API_KEY}" -F "data=@$filePath"; done'
        env:
          MYGET_API_KEY: ${{ secrets.MYGET_API_KEY }}

      - name: Docker Login (Github Container Registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Push
        run: |
          docker tag nexus-main/nexus:v_next ghcr.io/nexus-main/nexus:${{ needs.build.outputs.version }}
          docker push ghcr.io/nexus-main/nexus:${{ needs.build.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: npm package (npm)
        run: npm publish artifacts/package/nexus-api-*.tgz --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_release:
    needs: build
    name: Publish (release)
    runs-on: ubuntu-latest

    if: ${{ needs.build.outputs.is_release == 'true' }}

    permissions:
      contents: write # create the GitHub release

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install
        run: |
          python -m pip install twine

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Docker Load Image
        run: docker load --input artifacts/images/nexus_image.tar

      - name: GitHub Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/tag_body.txt

      - name: Nuget package (Nuget)
        run: dotnet nuget push 'artifacts/package/release/*.nupkg' --api-key ${NUGET_API_KEY} --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Python Package (PyPI)
        run: twine upload artifacts/package/*.whl -u__token__ -p"${PYPI_API_KEY}"
        env:
          PYPI_API_KEY: ${{ secrets.PYPI_API_KEY }}

      - name: Docker Login (Docker Hub)
        uses: docker/login-action@v3
        with:
          username: nexusmain
          password: ${{ secrets.DOCKER_API_KEY }}

      - name: Docker Push
        run: |
          docker tag nexus-main/nexus:v_next nexusmain/nexus:${{ needs.build.outputs.version }}
          docker push nexusmain/nexus:${{ needs.build.outputs.version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: npm package (npm)
        run: npm publish artifacts/package/nexus-api-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
